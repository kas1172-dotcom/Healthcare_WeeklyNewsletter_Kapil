# Healthcare Regulatory & Policy Monitor — Automated Weekly Newsletter
# =======================================================
# This runs pipeline/scrape.py + pipeline/generate.py every Monday at 8am ET on GitHub's
# servers, then commits the result. Your site updates with zero effort.
#
# SETUP (one time):
#   1. In your repo, create folder: .github/workflows/
#   2. Put this file there, named: weekly-newsletter.yml
#   3. Go to repo Settings → Secrets and variables → Actions → New repository secret
#      Add two secrets:
#        ANTHROPIC_API_KEY   = your sk-ant-... key
#        CONGRESS_API_KEY    = your congress.gov key
#   4. Commit. It will run automatically every Monday, or trigger manually
#      from the Actions tab → "Run workflow".

name: Weekly Newsletter

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:   # lets you trigger it manually from the Actions tab

permissions:
  contents: write       # allows the action to commit newsletter_data.json

jobs:
  build-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests feedparser anthropic beautifulsoup4

      - name: Debug env setup
        run: |
          echo "ANTHROPIC_API_KEY set: ${ANTHROPIC_API_KEY:+yes}"
          echo "CONGRESS_API_KEY set: ${CONGRESS_API_KEY:+yes}"
          echo "GITHUB_REPO=${GITHUB_REPO}"

      - name: Scrape sources
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: python pipeline/scrape.py -o raw_articles.json

      - name: Generate newsletter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: python pipeline/generate.py -i raw_articles.json -o newsletter_data.json

      - name: Validate generated files
        run: python pipeline/validate.py --raw raw_articles.json --newsletter newsletter_data.json

      - name: Commit updated newsletter
        run: |
          git config user.name  "Newsletter Bot"
          git config user.email "actions@github.com"
          # Ensure we have the latest remote changes to avoid non-fast-forward errors
          BRANCH=${GITHUB_REF#refs/heads/}
          git fetch origin $BRANCH
          git pull --rebase origin $BRANCH || true
          git add newsletter_data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly newsletter update $(date +%Y-%m-%d)"
            git push origin HEAD:$BRANCH --force-with-lease
          fi
